<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1540" viewBox="0 0 1400 1540">
  <rect width="1400" height="1540" fill="#ffffff"/>
  <style>
    .title { font: 700 42px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .subtitle { font: 400 22px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #666666; }
    .section { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .item { font: 400 23px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #202020; }
    .mono { font: 600 22px "SFMono-Regular", Consolas, monospace; fill: #202020; }
    .purple { fill: #7047d8; }
    .muted { fill: #666666; }
    .small { font: 400 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #666666; }
  </style>

  <text x="58" y="78" class="title">FineART-VLA 数据集结构概览</text>
  <text x="60" y="116" class="subtitle">clean_ready_224_1028_fineart_vla · 47 个 episodes · 7443 帧</text>

  <rect x="28" y="150" width="1344" height="1260" rx="28" fill="#ffffff" stroke="#dddddd" stroke-width="3"/>

  <!-- meta -->
  <g transform="translate(72 208)">
    <rect x="0" y="5" width="34" height="25" rx="4" fill="none" stroke="#666666" stroke-width="3"/>
    <path d="M2 12h12l5 5h13" fill="none" stroke="#666666" stroke-width="3"/>
    <text x="60" y="34" class="section">meta/</text>
    <text x="72" y="90" class="mono">tasks.parquet</text>
    <text x="370" y="90" class="item">主任务文本 + task_index</text>
    <text x="72" y="137" class="mono">subtasks.parquet</text>
    <text x="370" y="137" class="item">子任务文本 + subtask_index</text>
    <text x="72" y="184" class="mono">info.json</text>
    <text x="370" y="184" class="item">数据特征、频率、维度和语言字段定义</text>
    <text x="72" y="231" class="mono">stats.json</text>
    <text x="370" y="231" class="item">State / Action 归一化统计信息</text>
  </g>
  <line x1="70" y1="490" x2="1330" y2="490" stroke="#e5e5e5" stroke-width="2"/>

  <!-- data -->
  <g transform="translate(72 540)">
    <rect x="0" y="5" width="34" height="25" rx="4" fill="none" stroke="#666666" stroke-width="3"/>
    <path d="M2 12h12l5 5h13" fill="none" stroke="#666666" stroke-width="3"/>
    <text x="60" y="34" class="section">data/</text>
    <text x="72" y="90" class="mono">chunk-000/file-*.parquet</text>
    <text x="570" y="90" class="item">每个 episode 一个 Parquet 文件</text>
    <text x="72" y="137" class="mono">observation.state / action</text>
    <text x="570" y="137" class="item">机器人 State、Action</text>
    <text x="72" y="184" class="mono">timestamp / frame_index</text>
    <text x="570" y="184" class="item">时间戳和帧编号</text>
    <text x="72" y="231" class="mono">subtask_index</text>
    <text x="570" y="231" class="item">当前帧所属的子任务编号</text>
    <text x="72" y="289" class="mono purple">language_persistent</text>
    <text x="570" y="289" class="item purple">Subtask 标注时间线（FineART 核心）</text>
    <text x="72" y="336" class="mono">language_events</text>
    <text x="570" y="336" class="item">瞬时语言事件（当前数据为空）</text>
    <rect x="68" y="365" width="1190" height="58" rx="10" fill="#f7f4ff"/>
    <text x="90" y="402" class="small">每帧的 language_persistent 都包含该 episode 的子任务边界和文本，recipe 根据 timestamp 选择当前 subtask。</text>
  </g>
  <line x1="70" y1="1015" x2="1330" y2="1015" stroke="#e5e5e5" stroke-width="2"/>

  <!-- videos -->
  <g transform="translate(72 1060)">
    <rect x="0" y="5" width="34" height="25" rx="4" fill="none" stroke="#666666" stroke-width="3"/>
    <path d="M2 12h12l5 5h13" fill="none" stroke="#666666" stroke-width="3"/>
    <text x="60" y="34" class="section">videos/</text>
    <text x="72" y="90" class="mono">observation.images.head_right/</text>
    <text x="610" y="90" class="item">头部右侧相机 MP4</text>
    <text x="72" y="137" class="mono">observation.images.left_arm/</text>
    <text x="610" y="137" class="item">左臂相机 MP4</text>
    <text x="72" y="184" class="mono">observation.images.right_arm/</text>
    <text x="610" y="184" class="item">右臂相机 MP4</text>
    <text x="72" y="236" class="small">视频保持原始 224×224、30 FPS；转换过程未重新编码。</text>
  </g>

  <rect x="70" y="1352" width="1260" height="1" fill="#e5e5e5"/>
  <text x="72" y="1390" class="mono">fineart_conversion_report.json</text>
  <text x="610" y="1390" class="item">转换记录、episode 数量、帧数和子任务汇总</text>
</svg>
