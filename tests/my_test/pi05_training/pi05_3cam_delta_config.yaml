# ============================================================================
# PI05 + Delta Action + 指定摄像头训练配置
# ============================================================================
# 与完整配置的区别：
#   1. 只使用 3 个摄像头：head_right, left_arm, right_arm（排除 head_left）
#      → 通过显式设置 input_features 实现，无需修改数据集
#   2. 启用 delta action（use_relative_actions=true）
#   3. state/action 保持原始 23 维（不含 leg/head 维度过滤，因为纯配置做不到）
#
# 注意：input_features 显式指定后，策略只处理列出的特征，
#       数据集中 head_left 摄像头仍会被加载但不会被模型使用。
# ============================================================================

# ---------------------------------------------------------------------------
# 数据集
# ---------------------------------------------------------------------------
dataset:
  repo_id: null
  root: /mnt/data2/dataset/data_jizheng/galbot_spray/spray_lerobotv3_all_index
  episodes: null

# ---------------------------------------------------------------------------
# 策略模型（PI05 + Delta Action）
# ---------------------------------------------------------------------------
policy:
  type: pi05

  # ---- 模型架构 ----
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16 #float32
  image_resolution: [224, 224]

  # ---- 显式指定 input_features：只使用 3 个摄像头 + state ----
  # camera 类型为 VISUAL，state 类型为 STATE
  # 未列出的特征（如 head_left）不会被模型处理
  input_features:
    observation.state:
      type: STATE
      shape: [23]
    observation.images.head_right:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_arm:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_arm:
      type: VISUAL
      shape: [3, 224, 224]

  # output_features 留空，运行时自动从数据集推断为 action
  output_features: {}

  # ---- 观测 / 动作 ----
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50
  max_state_dim: 32
  max_action_dim: 32

  # ---- 归一化 ----
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

  # ---- 相对动作 ----
  use_relative_actions: true
  relative_exclude_joints: ["gripper"]

  # ---- Flow Matching ----
  num_inference_steps: 10
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0

  # ---- 编译优化 ----
  compile_model: true
  compile_mode: max-autotune

  # ---- 冻结策略 ----
  freeze_vision_encoder: false
  train_expert_only: false

  # ---- 优化器 ----
  optimizer_lr: 2.5e-5
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0

  # ---- 学习率调度 ----
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-6

  # ---- 设备 / 精度 ----
  device: cuda
  use_amp: false
  use_peft: false
  gradient_checkpointing: true

  # ---- Hub 相关 ----
  pretrained_path: null
  push_to_hub: false

# ---------------------------------------------------------------------------
# 输出与任务
# ---------------------------------------------------------------------------
output_dir: null
job_name: pi05_3cam_painting_delta

# ---------------------------------------------------------------------------
# 训练通用参数
# ---------------------------------------------------------------------------
seed: 42
resume: false
cudnn_deterministic: false

batch_size: 16
num_workers: 8
prefetch_factor: 8
persistent_workers: true

steps: 50000
log_freq: 50
eval_freq: 5000
save_freq: 10000
save_checkpoint: true

use_policy_training_preset: true

# ---------------------------------------------------------------------------
# SwanLab / WandB
# ---------------------------------------------------------------------------
wandb:
  enable: true
  backend: swanlab
  project: lerobot-pi05-painting
  mode: online
